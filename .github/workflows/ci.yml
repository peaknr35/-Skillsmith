name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (non-editable, to test the shipped templates)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" jsonschema
      - name: Tests (scripted fake LLM and synthetic PDFs; no live model, no API key)
        run: python -m pytest -q
